spring.application.name=contable

# ---------------------------------------------------------------------------
# Base de datos: XAMPP (MariaDB) en el puerto 3306
# Requiere tener MySQL iniciado en el panel de control de XAMPP.
# createDatabaseIfNotExist=true crea la base "contable" si todavía no existe.
# XAMPP trae por defecto el usuario "root" SIN contraseña; si le pusiste una, completala acá.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://localhost:3306/contable?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# update: crea las tablas que falten y agrega columnas nuevas, SIN borrar datos.
# (Otros valores: validate = solo verifica, none = no toca nada, create-drop = borra todo al cerrar)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Cambiar a true para ver en la consola el SQL que ejecuta Hibernate (útil para estudiar)
spring.jpa.show-sql=false
